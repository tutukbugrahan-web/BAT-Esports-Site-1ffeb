<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Girişi | BAT ESPORTS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#5a091355,transparent 55%),#09090a;color:white;font:15px/1.6 system-ui,sans-serif;padding:20px}.box{width:min(430px,100%);padding:28px;background:#131315;border:1px solid #353539;border-radius:8px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:1000;letter-spacing:.1em;margin-bottom:25px}.brand img{width:64px;height:64px;object-fit:contain}.brand i{font-style:normal;color:#ed1c24}.eyebrow{font-size:10px;letter-spacing:.2em;color:#ff6067;font-weight:900}h1{margin:6px 0;font-size:30px;line-height:1.1}p{color:#aaa;font-size:13px}label{display:block;margin:16px 0 5px;font-size:10px;font-weight:900;letter-spacing:.1em}input{width:100%;padding:12px;color:white;background:#080809;border:1px solid #39393e;border-radius:4px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:4px;background:#ed1c24;color:white;font-weight:950;cursor:pointer}.msg{color:#ff858a;font-size:13px;margin-top:12px;min-height:20px}.back{display:inline-block;margin-top:15px;color:#ddd;font-size:13px}.note{border-top:1px solid #333;margin-top:20px;padding-top:13px;color:#888;font-size:11px}</style></head><body><form id="f" class="box"><a href="/" class="brand"><img id="loginLogo" src="/assets/bat-logo-official.webp" alt="BAT Esports"><span>BAT <i>ESPORTS</i></span></a><div class="eyebrow">YÖNETİM PANELİ</div><h1>Güvenli giriş.</h1><p>İçerikleri düzenlemek için yönetici hesabınla giriş yap.</p><label>KULLANICI ADI</label><input name="username" autocomplete="username" required maxlength="80"><label>ŞİFRE</label><input name="password" type="password" autocomplete="current-password" required maxlength="200"><button id="b">GİRİŞ YAP ↗</button><div class="msg" id="m" aria-live="polite"></div><div class="note" id="apiStatus">Sunucu bağlantısı kontrol ediliyor…</div><a class="back" href="/">← Siteye dön</a><div class="note">Şifreyi GitHub dosyalarına yazma. Yalnızca Netlify ortam değişkenlerinde sakla.</div></form><script>
const f=document.querySelector('#f'),b=document.querySelector('#b'),m=document.querySelector('#m'),apiStatus=document.querySelector('#apiStatus');
async function checkApi(){
 try{
  const r=await fetch('/api/health',{cache:'no-store'});
  const raw=await r.text();let d=null;try{d=JSON.parse(raw)}catch{}
  if(r.ok&&d?.ok){apiStatus.textContent='Sunucu bağlantısı çalışıyor.';apiStatus.style.color='#8ce3ae'}
  else{apiStatus.textContent='API yanıtı: HTTP '+r.status+' — Deploys bölümündeki dağıtımı kontrol et.';apiStatus.style.color='#ff8589'}
 }catch{apiStatus.textContent='Sunucuya ulaşılamıyor. Site dağıtımı tamamlanmamış olabilir.';apiStatus.style.color='#ff8589'}
}
fetch('/api/me',{cache:'no-store'}).then(r=>{if(r.ok)location.replace('/admin.html')}).catch(()=>{});
checkApi();
fetch('/api/data',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{const img=document.getElementById('loginLogo');if(img&&d?.settings?.logoUrl)img.src=d.settings.logoUrl}).catch(()=>{});
f.onsubmit=async e=>{
 e.preventDefault();b.disabled=true;b.textContent='KONTROL EDİLİYOR…';m.textContent='';
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});
  const raw=await r.text();let d=null;try{d=JSON.parse(raw)}catch{}
  if(!r.ok)throw Error(d?.error||('Sunucu HTTP '+r.status+' yanıtı verdi. Netlify Deploys bölümünü kontrol et.'));
  if(!d?.ok)throw Error('Sunucudan beklenen giriş yanıtı alınamadı. Siteyi yeniden yayınla.');
  location.replace('/admin.html');
 }catch(x){m.textContent=x.message||'Sunucuya bağlanılamadı.'}
 finally{b.disabled=false;b.textContent='GİRİŞ YAP ↗'}
};
</script></body></html>
